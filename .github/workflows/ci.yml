name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # Covers src/ AND test/conformance.ts, which imports Quartz's real types.
      # If Quartz changes QuartzEmitterPlugin this fails here, rather than
      # silently in somebody's site build.
      - name: typecheck (includes Quartz conformance)
        run: npm run typecheck

      - run: npm test
      - run: npm run build

      # The unit tests import src/; the tarball ships dist/. A bundler
      # misconfiguration, a broken exports map or a missing bin shim all pass
      # the unit tests and break on install. This exercises the built artifact.
      - name: smoke test the shipped dist/
        run: npm run smoke

      # dist/ is committed so Quartz can install straight from a git ref. That
      # only helps if it matches src/ -- a stale dist is worse than none, since
      # it fails silently with old behaviour.
      - name: fail if committed dist/ is stale
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit."
            git diff --stat -- dist
            exit 1
          fi

      - name: verify the publish tarball contents
        run: npm pack --dry-run
