name: release
on:
  push:
    tags: ["v*"]

# id-token: write is what makes both provenance AND OIDC trusted publishing
# possible. npm verifies this token against the trusted-publisher configured on
# the package (org/repo/workflow), so no NPM_TOKEN is needed at all.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # 🪤 NODE 22 SHIPS npm 10.x, AND OIDC TRUSTED PUBLISHING NEEDS 11.5.1+.
      # Without this the publish falls back to looking for a token and fails
      # with an auth error that says nothing about the npm version -- so the
      # upgrade is explicit rather than inherited from whatever the runner
      # image happens to have this month.
      - name: upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run check

      # The tag is the source of truth for the version. npm versions are
      # immutable, so a mismatch would mean the tag and the tarball disagree
      # forever. Refuse rather than publish the wrong number.
      - name: tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. Authentication is the OIDC token from `permissions`
      # above, matched against the package's trusted publisher on npmjs.com.
      # Provenance is implied by trusted publishing but stated for clarity.
      - name: publish via trusted publisher
        run: npm publish --provenance --access public
