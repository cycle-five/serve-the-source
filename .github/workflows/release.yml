name: release
on:
  push:
    tags: ["v*"]

# id-token is what makes provenance possible: npm verifies the OIDC token from
# this workflow and attaches a signed, publicly verifiable link from the
# tarball back to this repo and commit. For a module whose whole pitch is "it
# will not leak your secrets", that attestation is worth more than usual.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check

      # The tag is the source of truth for the version. A mismatch means the
      # tag and the tarball would disagree forever, and npm versions are
      # immutable -- so refuse rather than publish the wrong number.
      - name: tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
